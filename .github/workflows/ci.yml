name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily, so a new advisory landing against an unchanged dependency tree is
    # caught promptly rather than waiting for the next unrelated PR. Only the
    # supply-chain job runs on this trigger (see the `if:` guards below).
    - cron: "0 6 * * *"

# Cancel superseded runs on the same ref (e.g. a new push to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The quality bar held by hand until now: fmt, clippy, and the test suite,
  # on the stable toolchain pinned by rust-toolchain.toml (which also installs
  # the rustfmt + clippy components). `git` is preinstalled on the runner, which
  # the tool and integration tests shell out to (ADR-0002).
  check:
    name: fmt + clippy + test
    # Gates code, not the advisory DB — skip on the daily cron.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test --all
        run: cargo test --all

  # Keep the declared MSRV honest by building on exactly that toolchain. The
  # repo's rust-toolchain.toml pins `stable`, which would otherwise override the
  # toolchain selected below, so remove it first.
  msrv:
    name: build on MSRV (1.94)
    # Gates code, not the advisory DB — skip on the daily cron.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Remove rust-toolchain.toml so it can't override the MSRV toolchain
        run: rm rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - name: cargo check on MSRV
        run: cargo check --workspace --all-targets --all-features

  # Supply-chain gate (issue #45): fail on a security advisory in the dependency
  # tree or a disallowed/unknown license, and surface duplicate versions. Policy
  # lives in the committed deny.toml; the action ships its own cargo-deny binary,
  # so no Rust toolchain or cache step is needed. Runs on PRs, pushes to main,
  # and the daily schedule (to catch advisories against an unchanged tree).
  supply-chain:
    name: cargo-deny (advisories + licenses + bans + sources)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
