[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeffparsons/git-full-send"

[workspace.dependencies]
# Internal crates.
gfs-common = { path = "crates/common" }
gfs-client = { path = "crates/client" }
gfs-server = { path = "crates/server" }
test-support = { path = "crates/test-support" }

# External crates. Versions are pinned here once and inherited by members via
# `dep.workspace = true`; see ADR-0001 for the rationale behind the core set.
anyhow = "1.0.102"
clap = "4.6.1"
gix = "0.84.0"
libc = "0.2.180"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = "1.52.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# Compile external dependencies with optimisations even in debug builds. The
# "*" glob matches only non-path (registry/git) packages, so our own workspace
# crates (gfs-common, gfs-client, gfs-server, test-support) stay at opt-level 0
# for fast, debuggable iterative builds. The test profile inherits from dev, so
# test builds benefit too; release is already optimised.
[profile.dev.package."*"]
opt-level = 3
