[package]
name = "gfs-client"
description = "Client-side library for git-full-send: synthesise sync state and push it to the server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gfs-common.workspace = true
# `tree-editor` (building trees without a scratch index) is not in gix's default
# feature set; `status`/`dirwalk`/`index` arrive via its defaults. See ADR-0002.
gix = { workspace = true, features = ["tree-editor"] }
rustix.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
gfs-server.workspace = true
tempfile.workspace = true
test-support.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
