[package]
name = "gfs-client"
description = "Client-side library for git-full-send: synthesise sync state and push it to the server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gfs-common.workspace = true
# Random bytes for the auto-generated default stream id (ADR-0012).
getrandom.workspace = true
# `tree-editor` (building trees without a scratch index) is not in gix's default
# feature set; `status`/`dirwalk`/`index` arrive via its defaults. See ADR-0002.
gix = { workspace = true, features = ["tree-editor"] }
rustix.workspace = true
# Derive `Serialize` for the per-sync metrics record (issue #42, ADR-0013).
serde = { workspace = true }
thiserror.workspace = true
# `process` backs the async `git push` spawn in the transfer step (`push_refs`):
# `tokio::process::Command` + `wait_with_output().await` yields during the
# receive-pack exchange instead of blocking the runtime thread (issue #61).
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true

[dev-dependencies]
gfs-common.workspace = true
gfs-server.workspace = true
tempfile.workspace = true
test-support.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
