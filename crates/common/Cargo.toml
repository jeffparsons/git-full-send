[package]
name = "gfs-common"
description = "Shared protocol types and constants for git-full-send."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bstr.workspace = true
gix-validate.workspace = true
# Metrics records serialised as JSON Lines, written best-effort to a per-side
# sink (issue #42, ADR-0013); `tracing` carries the warning when a write fails.
serde = { workspace = true }
serde_json.workspace = true
# Per-invocation temp files receive a `git` child's trace2 event stream, which
# decomposes a phase timing from the inside (ADR-0017).
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
