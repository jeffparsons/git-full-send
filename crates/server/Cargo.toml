[package]
name = "git-full-send-server"
description = "Server-side library for git-full-send: receive synced objects and update the worktree."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
git-full-send-common.workspace = true
# `tree-editor` (overlaying the `extra` tree onto `code` without a scratch index)
# is not in gix's default feature set; object access arrives via its defaults.
# See ADR-0002.
gix = { workspace = true, features = ["tree-editor"] }
# Derive `Serialize` for the per-operation metrics records (issue #42, ADR-0013).
serde = { workspace = true }
# `doctor`'s per-check detail is heterogeneous (counts, paths, booleans), so it
# is carried as JSON values rather than a check-specific struct (ADR-0018).
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
# `net`/`signal`/`sync`/`time`/`macros` back the bounded, signal-driven accept
# loop (issue #47): tokio `TcpListener`, Unix signal streams, `Semaphore`,
# per-connection timeout, and `tokio::select!`.
tokio = { workspace = true, features = [
    "rt",
    "net",
    "signal",
    "sync",
    "time",
    "macros",
] }
tracing.workspace = true

[dev-dependencies]
test-support.workspace = true
