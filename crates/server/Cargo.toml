[package]
name = "gfs-server"
description = "Server-side library for git-full-send: receive synced objects and update the worktree."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gfs-common.workspace = true
# `tree-editor` (overlaying the `extra` tree onto `code` without a scratch index)
# is not in gix's default feature set; object access arrives via its defaults.
# See ADR-0002.
gix = { workspace = true, features = ["tree-editor"] }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true

[dev-dependencies]
test-support.workspace = true
